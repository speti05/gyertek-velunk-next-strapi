# for local
services:
  strapi:
    build: ./server
    ports:
      - "1337:1337"
    env_file: ./server/.env
    volumes:
      - strapi-data:/opt/app/.tmp
      - strapi-uploads:/opt/app/public/uploads

  client:
    build:
      context: ./client
      # Next.js inlines NEXT_PUBLIC_* at build time, so they have to be build args --
      # the environment block below only reaches the server-side code. The values come
      # from client/.env.local, which the docker:local scripts pass in as an env file;
      # the defaults keep the build working without it.
      args:
        NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:-http://localhost:1337}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    ports:
      - "3000:3000"
    environment:
      - STRAPI_API_URL=http://strapi:1337
      - PUBLIC_API_URL=http://strapi:1337
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
    depends_on:
      - strapi

volumes:
  strapi-data:
  strapi-uploads:
