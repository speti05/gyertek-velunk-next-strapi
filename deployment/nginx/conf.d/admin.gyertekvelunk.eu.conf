# Bootstrap config (HTTP only) - active until the TLS certificate has been
# issued. See deployment/FIRST_DEPLOYMENT.md "Issuing TLS certificates" for how to
# replace this with admin.gyertekvelunk.eu.conf.ssl once certbot has run.
server {
    listen 80;
    listen [::]:80;
    server_name admin.gyertekvelunk.eu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://strapi:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }
}
