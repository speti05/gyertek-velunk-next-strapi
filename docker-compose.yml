# for production
services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USERNAME}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  strapi:
    image: ghcr.io/speti05/gyertek-velunk-server:latest
    env_file: ./server/.env.production
    volumes:
      - strapi-uploads:/opt/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  client:
    image: ghcr.io/speti05/gyertek-velunk-client:latest
    environment:
      # Internal Docker network: use service name to reach Strapi
      - STRAPI_API_URL=http://strapi:1337
      - PUBLIC_API_URL=http://strapi:1337
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
      - PREVIEW_SECRET=${PREVIEW_SECRET}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
    depends_on:
      - strapi
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - strapi
      - client
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;"]

volumes:
  postgres-data:
  strapi-uploads:
  certbot-etc:
  certbot-www:
