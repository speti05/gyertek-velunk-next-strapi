name: Build and Deploy

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/gyertek-velunk-server
  CLIENT_IMAGE: ghcr.io/${{ github.repository_owner }}/gyertek-velunk-client

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:latest
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ${{ env.CLIENT_IMAGE }}:latest
            ${{ env.CLIENT_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
          build-args: |
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
            NEXT_PUBLIC_STRAPI_URL=${{ vars.NEXT_PUBLIC_STRAPI_URL }}

  backup:
    needs: build-and-push
    uses: ./.github/workflows/backup-postgres.yml
    with:
      backup_dir: deploy
      retain: 5
    secrets: inherit

  deploy:
    needs: backup
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/gyertek-velunk

            echo "Deploying commit ${{ github.sha }}"

            docker compose pull
            docker compose up -d

            # The compose file tracks :latest, so verify that the containers really run the
            # images built from THIS commit. Catches a stale :latest (e.g. a re-run of an
            # older workflow run) instead of silently deploying old code.
            for service in strapi client; do
              case "$service" in
                strapi) expected_ref="${{ env.SERVER_IMAGE }}:${{ github.sha }}" ;;
                client) expected_ref="${{ env.CLIENT_IMAGE }}:${{ github.sha }}" ;;
              esac

              docker pull -q "$expected_ref" > /dev/null
              expected_id=$(docker image inspect "$expected_ref" --format '{{.Id}}')
              running_id=$(docker inspect "$(docker compose ps -q "$service")" --format '{{.Image}}')

              echo "$service: running=$running_id expected=$expected_id ($expected_ref)"

              if [ "$running_id" != "$expected_id" ]; then
                echo "::error::$service is not running the image built from ${{ github.sha }}"
                exit 1
              fi
            done

            docker image prune -f
